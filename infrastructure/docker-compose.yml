services:
  postgres:
    image: postgres:16-alpine
    container_name: folkloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: folkloop
      POSTGRES_PASSWORD: folkloop
      POSTGRES_DB: folkloop
    ports:
      - "5432:5432"
    volumes:
      - folkloop_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folkloop -d folkloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    container_name: folkloop-temporal
    user: "0:0"
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - folkloop_temporal_data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  folkloop_pgdata:
  folkloop_temporal_data:
