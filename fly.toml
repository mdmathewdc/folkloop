# Fly.io configuration for the always-on Folkloop Temporal Worker
# Replace `app` with your unique Fly.io app name before deploying.
app = "folkloop-worker"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  PORT = "8080"
  TEMPORAL_TASK_QUEUE = "folkloop-villagers"
  SIMULATION_MS_PER_HOUR = "30000"
  CONTINUE_AS_NEW_AFTER_DAYS = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
